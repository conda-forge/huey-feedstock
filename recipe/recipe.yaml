schema_version: 1

context:
  version: "3.5.0"

package:
  name: huey
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/h/huey/huey-${{ version }}.tar.gz
  sha256: e40177e871ff68438f953bfc1a8b17f594625a1e6d8dd680144f03638d3173dc

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-build-isolation --no-deps
  python:
    entry_points:
      - huey_consumer = huey.bin.huey_consumer:consumer_main

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools
    - pip
  run:
    - python >=${{ python_min }}
  run_constraints:
    - redis-py >=3.0.0
    - psycopg >=3.2
    - cysqlite >=0.3.5

tests:
  - python:
      imports:
        - huey
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - python ${{ python_min }}.*
    script:
      - huey_consumer --help

about:
  summary: huey, a little task queue
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/coleifer/huey/
  documentation: https://huey.readthedocs.io

extra:
  recipe-maintainers:
    - kwilcox
    - synapticarbors
